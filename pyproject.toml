[project]
name = "codepilot"
version = "0.3.0"
description = "Codepilot: local coding agent focused on CLI workflows and DingTalk remote control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "jsonschema>=4.21.0",
  "rich>=13.0.0",
  "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dingtalk = ["dingtalk-stream>=0.24.3,<0.25"]
web = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
]

[project.scripts]
codepilot = "codepilot.interfaces.cli.main:main"
codepilot-dingtalk = "codepilot.interfaces.dingtalk.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codepilot.interfaces.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["test"]

